<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="white"/>
  
  <!-- Grid -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="50" y1="250" x2="350" y2="250"/>
    <line x1="50" y1="50" x2="50" y2="250"/>
  </g>
  
  <!-- Original performance line -->
  <line x1="50" y1="150" x2="350" y2="150" 
        stroke="#94a3b8" 
        stroke-width="2" 
        stroke-dasharray="5,5"/>
  
  <!-- J-curve path - starts at baseline, dips down, then rises above -->
  <path d="M 50 150 L 100 150 Q 140 160 160 190 Q 180 210 200 205 Q 220 195 240 170 Q 280 120 350 80" 
        fill="none" 
        stroke="#3b82f6" 
        stroke-width="4"/>
  
  <!-- Labels -->
  <text x="200" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#374151">Time</text>
  <text x="20" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#374151" transform="rotate(-90 20 150)">Performance</text>
  
  <!-- Annotations -->
  <text x="75" y="140" font-family="Arial, sans-serif" font-size="14" fill="#10b981">Starting</text>
  <text x="160" y="230" font-family="Arial, sans-serif" font-size="14" fill="#ef4444">The Dip</text>
  <text x="280" y="100" font-family="Arial, sans-serif" font-size="14" fill="#3b82f6">Higher Performance</text>
  
  <!-- Legend -->
  <text x="100" y="30" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Original performance</text>
  <line x1="60" y1="25" x2="95" y2="25" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>
  <line x1="350" y1="250" x2="360" y2="250" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="50" y1="250" x2="50" y2="40" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>